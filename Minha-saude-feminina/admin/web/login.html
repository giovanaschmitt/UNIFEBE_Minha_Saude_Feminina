<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Minha Saúde Feminina</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
  <link href="assets/fontes/fontes.css" rel="stylesheet">
  <link href="assets/css/estilo.css" rel="stylesheet">
</head>
<body class="tela-login">

<main class="container py-5">
  <div class="row justify-content-center align-items-center" style="min-height: 88vh;">
    <div class="col-12 col-md-7 col-lg-5 col-xl-4">

      <div class="marca-login text-center mb-4">
        <img class="marca-icone" src="assets/favicon.svg" alt="">
        <div>
          <div class="marca fs-4">Minha Saúde Feminina</div>
          <p class="ajuda mt-1 mb-0">Gestão de conteúdos</p>
        </div>
      </div>

      <div id="avisos"></div>

      <form class="cartao p-4" id="formLogin" novalidate>
        <h1 class="fs-5 mb-1">Entre para gerenciar os artigos</h1>
        <p class="ajuda mb-4">Use a conta cadastrada para a equipe editorial.</p>

        <div class="mb-3">
          <label class="form-label" for="email">E-mail</label>
          <input class="form-control" id="email" type="email" autocomplete="username"
                 placeholder="seu@email.com.br" required autofocus>
        </div>

        <div class="mb-4">
          <label class="form-label" for="senha">Senha</label>
          <div class="campo-senha">
            <input class="form-control" id="senha" type="password" autocomplete="current-password" 
              placeholder="Insira sua senha" required>
            <button class="botao-olho" type="button" id="verSenha" aria-label="Mostrar senha">
              <svg class="icone olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="icone olho-fechado d-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.7 3.6M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>

        <button class="btn btn-rosa w-100" type="submit" id="botaoEntrar">Entrar</button>

        <p class="ajuda text-center mt-3 mb-0" id="dicaModo"></p>
        
      </form>

    </div>
  </div>
</main>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/comum.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
